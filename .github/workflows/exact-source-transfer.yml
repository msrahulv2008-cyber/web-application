name: Exact Source Transfer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository contents with source repository
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/arunkrishna1602-cloud/CURD__webApplication.git /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -rf .github

      - name: Commit exact copy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Transfer exact 1:1 copy from CURD__webApplication"
            git push origin HEAD:main
          fi
