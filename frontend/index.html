<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmpTrack - Employee Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><h1>EmpTrack</h1><p>Employee Management System</p></div><button onclick="openModal()">+ Add Employee</button></header>
<main>
<section class="stats"><div><b id="total">0</b><span>Total Employees</span></div><div><b id="active">0</b><span>Active</span></div><div><b id="leave">0</b><span>On Leave</span></div><div><b id="resigned">0</b><span>Resigned</span></div></section>
<section class="toolbar"><input id="search" placeholder="Search by name or code" oninput="render()"><select id="department" onchange="render()"><option value="">All Departments</option><option>Engineering</option><option>HR</option><option>QA</option><option>DevOps</option><option>Finance</option><option>Marketing</option><option>Sales</option></select><select id="status" onchange="render()"><option value="">All Statuses</option><option>Active</option><option>On Leave</option><option>Resigned</option></select><button class="reset" onclick="resetFilters()">Reset</button></section>
<section class="card"><h2>Employee Records</h2><div class="table-wrap"><table><thead><tr><th>Code</th><th>Name</th><th>Email</th><th>Department</th><th>Designation</th><th>Salary</th><th>Status</th><th>Actions</th></tr></thead><tbody id="employees"></tbody></table></div></section>
</main>
<div id="modal" class="modal"><div class="modal-box"><h2 id="modalTitle">Add Employee</h2><form onsubmit="saveEmployee(event)"><input type="hidden" id="editId"><input id="code" placeholder="Employee Code" required><input id="name" placeholder="Full Name" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Phone Number" required><select id="dept" required><option value="">Select Department</option><option>Engineering</option><option>HR</option><option>QA</option><option>DevOps</option><option>Finance</option><option>Marketing</option><option>Sales</option></select><input id="designation" placeholder="Designation" required><input id="joining" type="date" required><input id="salary" type="number" min="0" placeholder="Monthly Salary" required><select id="empStatus"><option>Active</option><option>On Leave</option><option>Resigned</option></select><div class="actions"><button type="button" class="reset" onclick="closeModal()">Cancel</button><button type="submit">Save Employee</button></div></form></div></div>
<script src="script.js"></script>
</body></html>
